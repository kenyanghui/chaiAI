<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>拆书帮师承录</title>
<style>
:root{
  --paper:#f1e9d8;--paper-2:#e9dfca;--paper-3:#ddd0b5;
  --ink:#1d1814;--ink-2:#443a32;--ink-3:#7b6f62;--ink-4:#b0a38c;--ink-5:#d4c8b0;
  --zhu:#a8352a;--zhu-soft:rgba(168,53,42,.12);--zhe:#94653a;
  --seal-ink:#f8f0e2;
  --grain:none;
  --kai:"Kaiti SC","STKaiti","KaiTi","楷体","BiauKai","Songti SC","STSong","Noto Serif CJK SC","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --song:"Songti SC","STSong","Noto Serif CJK SC","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#171412;--paper-2:#201c19;--paper-3:#2a2521;
    --ink:#efe6d5;--ink-2:#d2c7b4;--ink-3:#9b8f7f;--ink-4:#6a6056;--ink-5:#3b342e;
    --zhu:#cf5846;--zhu-soft:rgba(207,88,70,.18);--zhe:#c38c57;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#171412;--paper-2:#201c19;--paper-3:#2a2521;
  --ink:#efe6d5;--ink-2:#d2c7b4;--ink-3:#9b8f7f;--ink-4:#6a6056;--ink-5:#3b342e;
  --zhu:#cf5846;--zhu-soft:rgba(207,88,70,.18);--zhe:#c38c57;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto}
body{margin:0;background-color:var(--paper);background-image:var(--grain);color:var(--ink-2);font-family:var(--song);font-size:16px;line-height:1.75;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
.kai{font-family:var(--kai)}
.seal{display:inline-flex;align-items:center;justify-content:center;background:var(--zhu);color:var(--seal-ink);font-family:var(--kai);border-radius:3px 4px 2px 4px;box-shadow:inset 0 0 0 2px var(--zhu),inset 0 0 0 3px rgba(248,240,226,.55);line-height:1;flex:none}

/* 顶栏 */
.top{position:sticky;top:0;z-index:20;background-color:var(--paper);background-image:var(--grain);border-bottom:1px solid var(--ink-5)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;flex-wrap:wrap;column-gap:16px}
.brand{display:flex;align-items:center;gap:10px;padding-bottom:2px}
.brand .seal{width:34px;height:34px;font-size:14px;writing-mode:vertical-rl;letter-spacing:.02em}
.brand-t{font-family:var(--kai);font-size:19px;color:var(--ink);letter-spacing:.08em}
.brand-t small{font-family:var(--song);font-size:11px;color:var(--ink-3);letter-spacing:0;margin-left:6px}
.tabs{display:flex;width:100%;margin-top:4px}
.tabs a{flex:1;text-align:center;padding:8px 0 11px;font-family:var(--kai);font-size:17px;color:var(--ink-3);position:relative;letter-spacing:.1em}
.tabs a.on{color:var(--ink)}
.tabs a.on::after{content:"";position:absolute;left:32%;right:32%;bottom:5px;height:2px;background:var(--zhu);border-radius:2px}
@media (min-width:760px){
  .top-in{flex-wrap:nowrap;padding-bottom:0}
  .tabs{width:auto;margin:0 0 0 auto}
  .tabs a{flex:none;padding:16px 14px 18px}
  .tabs a.on::after{bottom:10px;left:30%;right:30%}
}

.wrap{max-width:760px;margin:0 auto;padding:0 16px 40px}

/* 卷首 */
.hero{position:relative;margin:24px 8px 0;border:1px solid var(--ink);outline:3px solid var(--ink);outline-offset:4px;padding:26px 20px 22px;min-height:min(70vh,560px);display:flex;flex-direction:column}
.hero-row{display:flex;flex-direction:row-reverse;justify-content:space-between;gap:18px;flex:1}
.hero-t{display:flex;flex-direction:row-reverse;align-items:flex-start;gap:10px}
.hero h1{margin:0;writing-mode:vertical-rl;font-family:var(--kai);font-weight:normal;font-size:clamp(54px,15vw,84px);line-height:1;letter-spacing:.18em;color:var(--ink)}
.hero-t .seal{writing-mode:vertical-rl;width:30px;padding:8px 0;font-size:15px;letter-spacing:.1em;margin-top:6px}
.hero-l{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.hero-lead{font-family:var(--kai);font-size:19px;color:var(--ink);line-height:1.6;margin:4px 0 22px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:18px 18px;margin:0}
.stat b{display:block;font-family:var(--song);font-weight:600;font-size:clamp(30px,9vw,44px);line-height:1;color:var(--ink);letter-spacing:-.01em}
.stat span{font-family:var(--kai);font-size:15px;color:var(--ink-3)}
.hero-foot{margin-top:24px;font-size:12.5px;line-height:1.7;color:var(--ink-3)}
.cue{display:block;text-align:center;margin-top:16px;font-family:var(--kai);font-size:15px;color:var(--ink-3);animation:cue 2.4s ease-in-out infinite}
@keyframes cue{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(5px);opacity:1}}

.sh{display:flex;align-items:center;gap:12px;margin:64px 0 16px}
.sh .seal{width:30px;height:30px;font-size:16px}
.sh h2{margin:0;font-family:var(--kai);font-weight:normal;font-size:26px;line-height:1.3;color:var(--ink);letter-spacing:.06em}
.sh.first{margin-top:28px}
.p{font-size:17px;line-height:1.95;margin:0 0 14px;color:var(--ink-2)}
.p b{color:var(--ink);font-weight:600}
.p em{font-style:normal;color:var(--zhu)}
.cap{font-size:13px;line-height:1.7;color:var(--ink-3);margin:8px 0 0}
.more{display:inline-block;margin-top:12px;font-family:var(--kai);font-size:16px;color:var(--zhu);border-bottom:1px solid currentColor;padding-bottom:1px}

.rv{opacity:0;transform:translateY(12px);filter:blur(3px);transition:opacity .9s ease,transform .9s ease,filter .9s ease}
.rv.in{opacity:1;transform:none;filter:none}
.grow .gg{opacity:0;transition:opacity .6s ease}
.grow.in .gg{opacity:1}
@media (prefers-reduced-motion:reduce){.rv,.grow .gg{opacity:1;transform:none;filter:none;transition:none}.cue{animation:none}}

.forest{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px 13px;padding:18px 2px 6px}
.gl path{fill:none;stroke:var(--ink-3);stroke-width:1}
.gl circle{fill:var(--ink-2)}
.gl circle.h{fill:var(--zhu)}
.gl.allh path{stroke:var(--zhu)}
.gl.allh circle{fill:var(--zhu)}
.gl.dim circle:not(.h){fill:var(--ink-4)}
.gl.dim path{stroke:var(--ink-5)}

.stree{display:block;width:100%;height:auto;margin:18px 0 4px}
.stree path{fill:none;stroke:var(--ink-4);stroke-width:1}
.stree path.c{stroke:var(--zhu);stroke-width:1.8}
.stree circle{fill:var(--ink-2)}
.stree circle.c{fill:var(--zhu)}
.stree .t-cl{font-family:var(--kai);font-size:15px;fill:var(--zhu);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.t-gh{font-family:var(--kai);font-size:12px;fill:var(--ink-3)}

.relay{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:8px;margin-top:16px}
.rc{display:flex;flex-direction:column;border:1px solid var(--ink-5);background:var(--paper-2);padding:8px 10px 9px;border-radius:2px;min-width:0}
.rc .a{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .n{font-family:var(--kai);font-size:20px;color:var(--ink);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .k{font-size:12px;color:var(--zhu);line-height:1.5}
.rc .k2{font-size:11.5px;color:var(--ink-3);line-height:1.4}

.slips{display:flex;align-items:flex-end;gap:6px;height:230px;padding-top:6px;margin-top:10px}
.slip{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;border:0;background:none;padding:0;cursor:pointer;min-width:0}
.slip .n{font-family:var(--kai);font-size:17px;color:var(--ink);line-height:1.2;margin-bottom:4px}
.slip .bar{width:62%;max-width:30px;background:var(--ink-2);border-radius:3px 3px 1px 1px;min-height:2px;box-shadow:inset -3px 0 0 rgba(0,0,0,.12)}
.slip .y{font-size:12px;color:var(--ink-3);margin-top:7px;white-space:nowrap;line-height:1.25;height:2.5em}
.slip.mx .bar{background:var(--zhu)}
.slip.sel .y{color:var(--ink);font-weight:600}
.slip.sel .bar{outline:2px solid var(--zhu);outline-offset:2px}
.slips.ro .slip{cursor:default}

.xp{list-style:none;margin:14px 0 0;padding:0}
.xp li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--ink-5);font-family:var(--kai);font-size:16px;color:var(--ink)}
.xp li .ar{flex:1;height:1px;background:var(--ink-4);position:relative;min-width:24px}
.xp li .ar::after{content:"";position:absolute;right:0;top:-3px;border-left:6px solid var(--ink-4);border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}
.xp li[hidden]{display:none}
.xp li small{font-family:var(--song);font-size:12px;color:var(--ink-3);min-width:2.2em;text-align:right}

.lvbar{display:flex;height:26px;margin-top:16px;border:1px solid var(--ink-4)}
.lvbar i{display:block;height:100%}
.lv3{background:var(--zhu)}.lv2{background:var(--zhe)}.lv1{background:var(--ink-3)}.lv0{background:transparent}
.lvleg{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:13px;color:var(--ink-3)}
.lvleg span{display:inline-flex;align-items:center;gap:6px}
.lvleg i{width:12px;height:12px;display:inline-block;border:1px solid var(--ink-4)}

.sbox{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--ink);margin-top:14px}
.sbox input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--kai);font-size:22px;padding:10px 2px;color:var(--ink);outline:none;-webkit-appearance:none;border-radius:0}
.sbox input::placeholder{color:var(--ink-4)}
.sbox button{border:0;background:none;font-family:var(--kai);font-size:17px;color:var(--zhu);padding:8px 4px;cursor:pointer}

/* 诸脉 */
.ctl{background:var(--paper-2);border:1px solid var(--ink-5);border-radius:3px;padding:12px 14px;margin:18px 0 8px}
@media (min-width:760px){.ctl{position:sticky;top:var(--toph,70px);z-index:5}}
.ctl-r{display:flex;align-items:center;gap:10px;min-height:40px}
.ctl-r>span{font-family:var(--kai);font-size:15px;color:var(--ink-3);flex:none;width:2.4em}
.ctl select{flex:1;min-width:0;border:0;border-bottom:1px solid var(--ink-4);background:transparent;padding:6px 2px;font-family:var(--kai);font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none;border-radius:0}
.ctl select option{background:var(--paper);color:var(--ink)}
.ctl-y{font-family:var(--kai);font-size:16px;color:var(--ink);min-width:5.4em;text-align:center}
.ctl-sum{font-size:13px;color:var(--ink-3);margin-top:4px}
input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;background:transparent;height:30px}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ink-4)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--zhu);margin-top:-9px;border:3px solid var(--paper-2);box-shadow:0 0 0 1px var(--zhu)}
input[type=range]::-moz-range-track{height:2px;background:var(--ink-4)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--zhu);border:3px solid var(--paper-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ink-2);padding:9px 16px;font-family:var(--kai);font-size:16px;color:var(--ink);background:transparent;border-radius:3px;cursor:pointer;line-height:1.2}
.btn.sm{padding:6px 10px;font-size:14px;flex:none}
.btn.zhu{background:var(--zhu);border-color:var(--zhu);color:var(--seal-ink)}
.lst-h{font-family:var(--kai);font-size:18px;color:var(--ink);margin:30px 0 4px;display:flex;align-items:baseline;gap:10px}
.lst-h small{font-family:var(--song);font-size:12.5px;color:var(--ink-3)}
.lr{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px dashed var(--ink-5)}
.lr-t{flex:1;min-width:0}
.lr-n{font-family:var(--kai);font-size:19px;color:var(--ink);line-height:1.35}
.lr-s{font-size:12.5px;color:var(--ink-3);line-height:1.6}
.lr-g{flex:0 1 auto;max-width:60%;display:flex;justify-content:flex-end}
.lr-g svg{max-width:100%;height:auto}
.dan{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin-top:6px}
.di{display:block;padding:9px 0;border-bottom:1px dashed var(--ink-5);min-width:0}
.di .pr{display:flex;align-items:center;gap:6px;font-family:var(--kai);font-size:16px;color:var(--ink);white-space:nowrap}
.di .pr span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.di .pr i{font-style:normal;color:var(--ink-4);flex:none}
.di small{display:block;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:28px 0;text-align:center;color:var(--ink-3);font-family:var(--kai)}

/* 分舵 */
.br{display:grid;grid-template-columns:minmax(6.5em,8.5em) 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--ink-5)}
.br .bn{font-family:var(--kai);font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br .bb{height:7px;background:transparent;position:relative}
.br .bb i{position:absolute;left:0;top:0;bottom:0;background:var(--ink-2);border-radius:1px}
.br .bb i.x{background:var(--zhu);opacity:.85}
.br .bc{font-size:13px;color:var(--ink-3);white-space:nowrap}
.rhide{display:none!important}
.tog{border:0;background:none;color:var(--zhu);font-family:var(--kai);font-size:15px;padding:10px 0;cursor:pointer}

/* 纪年 */
.yd-h{font-family:var(--kai);font-size:30px;color:var(--ink);margin:30px 0 2px;letter-spacing:.06em}
.yd-s{font-size:13.5px;color:var(--ink-3);margin-bottom:6px}
.mo{font-family:var(--kai);font-size:16px;color:var(--zhu);margin:18px 0 2px}
.rl{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-bottom:1px dashed var(--ink-5);flex-wrap:wrap}
.rl .pr{font-family:var(--kai);font-size:16px;color:var(--ink)}
.rl .pr i{font-style:normal;color:var(--ink-4);margin:0 4px}
.rl small{font-size:12px;color:var(--ink-3)}

/* 寻人 */
.rr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--ink-5)}
.rr-t{flex:1;min-width:0}
.rr-n{font-family:var(--kai);font-size:20px;color:var(--ink);line-height:1.35}
.rr-n small{font-family:var(--song);font-size:13px;color:var(--ink-3);margin-left:8px}
.rr-m{font-size:12.5px;color:var(--ink-3)}
.mseal{display:inline-flex;gap:3px;flex:none}
.mseal .seal{font-size:11px;padding:3px 4px;box-shadow:inset 0 0 0 1px var(--zhu),inset 0 0 0 2px rgba(248,240,226,.5)}
.hint{color:var(--ink-3);font-size:14px;margin:14px 0}
.qk{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

/* 浮层 */
.sheet{position:fixed;inset:0;z-index:40;background-color:var(--paper);background-image:var(--grain);overflow-y:auto;-webkit-overflow-scrolling:touch;opacity:0;transform:translateY(18px);transition:opacity .22s ease,transform .22s ease;pointer-events:none;visibility:hidden}
.sheet.open{opacity:1;transform:none;pointer-events:auto;visibility:visible}
.sh-top{position:sticky;top:0;z-index:3;background-color:var(--paper);background-image:var(--grain);border-bottom:1px solid var(--ink-5)}
.sh-top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:8px 10px}
.sh-back{border:0;background:none;font-family:var(--kai);font-size:16px;color:var(--ink-2);padding:8px 8px;cursor:pointer;flex:none}
.sh-ttl{font-family:var(--kai);font-size:17px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-body{max-width:760px;margin:0 auto;padding:18px 16px 70px}
.sh-body.wide{max-width:980px}

.ps-name{font-family:var(--kai);font-size:42px;line-height:1.2;color:var(--ink);margin:6px 0 2px;letter-spacing:.04em;word-break:break-all}
.ps-alt{font-size:14px;color:var(--ink-3)}
.meta{display:flex;flex-wrap:wrap;gap:2px 16px;font-size:14px;color:var(--ink-3);margin:10px 0 0}
.meta a{color:var(--ink-2);border-bottom:1px solid var(--ink-4)}
.certs{display:flex;gap:12px;margin:16px 0 0;align-items:flex-end}
.cert{display:flex;flex-direction:column;align-items:center;gap:4px}
.cert .seal{width:42px;height:42px;font-size:15px}
.cert small{font-size:11.5px;color:var(--ink-3)}
.blk{margin:30px 0 0}
.blk h3{display:flex;align-items:center;gap:9px;margin:0 0 10px;font-family:var(--kai);font-weight:normal;font-size:19px;color:var(--ink)}
.blk h3::before{content:"";width:3px;height:17px;background:var(--zhu);border-radius:1px}
.blk h3 small{font-family:var(--song);font-size:12.5px;color:var(--ink-3)}
.chain{list-style:none;margin:0;padding:0}
.chain li{display:grid;grid-template-columns:3.2em 16px 1fr;align-items:center;height:42px}
.chain .g{font-size:12px;color:var(--ink-3);text-align:right;padding-right:8px;font-family:var(--kai)}
.chain .dot{width:9px;height:9px;border-radius:50%;background:var(--ink-2);justify-self:center;position:relative}
.chain li:not(:last-child) .dot::after{content:"";position:absolute;left:4px;top:9px;width:1px;height:33px;background:var(--ink-4)}
.chain .me .dot{background:var(--zhu);box-shadow:0 0 0 4px var(--zhu-soft)}
.chain .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chain .nm b{font-family:var(--kai);font-weight:normal;font-size:18px;color:var(--ink)}
.chain .me .nm b{color:var(--zhu)}
.chain .nm small{font-size:12px;color:var(--ink-3);margin-left:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:baseline;gap:5px;border:1px solid var(--ink-4);border-radius:3px;padding:5px 10px 6px;font-family:var(--kai);font-size:16px;color:var(--ink);background:var(--paper);line-height:1.3}
.chip small{font-family:var(--song);font-size:11px;color:var(--ink-3)}
.chip.me{border-color:var(--zhu);color:var(--zhu)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
.cpbox{margin-top:10px;font-size:13px;color:var(--ink-3)}
.cpbox input{width:100%;margin-top:6px;padding:8px;border:1px solid var(--ink-4);background:var(--paper-2);font-size:13px;color:var(--ink)}

.zu-h{font-family:var(--kai);font-size:32px;color:var(--ink);margin:4px 0 2px;letter-spacing:.04em}
.zu-s{font-size:13.5px;color:var(--ink-3)}
.zu-b{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--ink-3);margin:8px 0 0}
.zu-b a{border-bottom:1px solid var(--ink-5)}
.leg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--ink-3);margin:12px 0 4px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg svg{flex:none}
.tree-wrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;margin:8px -16px 0;padding:6px 16px 10px}
.tree-wrap svg{display:block}
.tr-s{fill:none;stroke:var(--ink-3);stroke-width:1.1}
.tr-x{fill:none;stroke:var(--zhe);stroke-width:1.2;stroke-dasharray:3 3}
.tr-h{fill:none;stroke:var(--zhu);stroke-width:2.2;stroke-linejoin:round}
.t-n{font-family:var(--kai);font-size:14px;fill:var(--ink)}
.t-b{font-size:10.5px;fill:var(--ink-3)}
.nd{cursor:pointer}
.nd .hit{fill:transparent}
.nd circle{fill:var(--ink-2)}
.nd.root circle{fill:var(--zhu)}

<script>
(function(){
"use strict";
/* ---------- 纸纹 ---------- */
function grain(){
  try{
    var dark=getComputedStyle(document.documentElement).getPropertyValue('color-scheme').trim()==='dark';
    var s=180,c=document.createElement('canvas');c.width=c.height=s;var x=c.getContext('2d');
    var im=x.createImageData(s,s),d=im.data,base=dark?235:55;
    for(var i=0;i<d.length;i+=4){var v=Math.random();d[i]=d[i+1]=d[i+2]=base;d[i+3]=v<.55?v*(dark?14:22):0;}
    x.putImageData(im,0,0);
    x.strokeStyle=dark?'rgba(235,225,205,.05)':'rgba(90,70,40,.07)';x.lineWidth=.6;
    for(var k=0;k<14;k++){var a=Math.random()*s,b=Math.random()*s,l=6+Math.random()*16,t=Math.random()*Math.PI;
      x.beginPath();x.moveTo(a,b);x.quadraticCurveTo(a+Math.cos(t)*l/2+2,b+Math.sin(t)*l/2-2,a+Math.cos(t)*l,b+Math.sin(t)*l);x.stroke();}
    document.documentElement.style.setProperty('--grain','url('+c.toDataURL()+')');
  }catch(e){}
}
grain();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',grain)}catch(e){}

/* ---------- 数据 ---------- */
var D=JSON.parse(document.getElementById('data').textContent);
var P=D.p,META=D.meta;
P.forEach(function(p,i){p.i=i;p.kids=[];p.label=p.n||p.nk;p.alt=(p.n&&p.nk&&p.nk!==p.n)?p.nk:'';p.y=Math.max(2020,+p.e.slice(0,4));});
P.forEach(function(p){if(p.m>=0)P[p.m].kids.push(p.i)});
P.forEach(function(p){p.kids.sort(function(a,b){return P[a].e<P[b].e?-1:P[a].e>P[b].e?1:a-b})});
P.forEach(function(p){var g=1,r=p;while(r.m>=0){r=P[r.m];g++}p.gen=g;p.root=r.i});
var KEY={};P.forEach(function(p){KEY[p.k]=p.i});
var DN=[];function dn(i){if(DN[i]!=null)return DN[i];var n=0;P[i].kids.forEach(function(k){n+=1+dn(k)});return DN[i]=n}
P.forEach(function(p){dn(p.i)});
var E=P.filter(function(p){return p.m>=0});
function countBy(arr){var m={};arr.forEach(function(v){m[v]=(m[v]||0)+1});return Object.keys(m).map(function(k){return[k,m[k]]}).sort(function(a,b){return b[1]-a[1]||a[0].localeCompare(b[0],'zh')})}
var L=P.filter(function(p){return p.m<0&&p.kids.length}).map(function(r){
  var mem=[];(function w(i){mem.push(i);P[i].kids.forEach(w)})(r.i);
  var ks=mem.filter(function(i){return i!==r.i});
  var sd=ks.map(function(i){return P[i].e}).sort()[0];
  return{r:r.i,mem:mem,size:mem.length,depth:Math.max.apply(null,mem.map(function(i){return P[i].gen})),start:Math.max(2020,+sd.slice(0,4)),sd:sd,br:countBy(mem.map(function(i){return P[i].b}))};
}).sort(function(a,b){return b.size-a.size||a.sd.localeCompare(b.sd)});
var LBY={};L.forEach(function(l){LBY[l.r]=l});
var XK={};P.forEach(function(p){(p.x||[]).forEach(function(m){(XK[m]=XK[m]||[]).push(p.i)})});
var B={};function gb(n){return B[n]||(B[n]={name:n,ppl:[],inner:[],inE:[],outE:[],lin:{}})}
P.forEach(function(p){if(!p.b)return;var b=gb(p.b);b.ppl.push(p.i);b.lin[p.root]=1});
E.forEach(function(p){var m=P[p.m];if(!p.b||!m.b)return;if(m.b===p.b)gb(p.b).inner.push(p.i);else{gb(p.b).inE.push(p.i);gb(m.b).outE.push(p.i)}});
var BL=Object.keys(B).map(function(k){return B[k]}).sort(function(a,b){return b.ppl.length-a.ppl.length||a.name.localeCompare(b.name,'zh')});
var YMAX=Math.max.apply(null,P.map(function(p){return p.y}));
var YEARS=[];for(var yy=2020;yy<=YMAX;yy++)YEARS.push(yy);
var CROSS=E.filter(function(p){return p.b&&P[p.m].b&&P[p.m].b!==p.b});

/* ---------- 师父名片 ---------- */
var MP=JSON.parse(document.getElementById('mpd').textContent),MPK={};
MP.forEach(function(c,n){c.ix=n;c.i=c.k&&KEY[c.k]!=null?KEY[c.k]:-1;if(c.i>=0){MPK[c.i]=n;P[c.i].mpn=(c.n+' '+(c.a||'')).toLowerCase()}});

function reveal(){
  var els=view.querySelectorAll('.rv,.grow');
  if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in')});return}

  els.forEach(function(e){io.observe(e)});
}

function route(){
  var r=parse(),v=r.parts[0]||'story',h=location.hash||'#/';
  if(stack.length>1&&stack[stack.length-2]===h)stack.pop();else if(stack[stack.length-1]!==h)stack.push(h);
  var overlay=v==='ren'||v==='zu'||v==='bai'||v==='ying'||(v==='duo'&&r.parts[1]!=null)||(v==='mp'&&r.parts[1]!=null);
  if(overlay){
    if(!curBase)renderBase(v==='duo'||v==='mp'?v:'story',new URLSearchParams(),v==='duo'||v==='mp'?'#/'+v:'#/');
    var k=r.parts[1];
    if(v==='ren'){if(KEY[k]==null)sMissing();else sPerson(KEY[k])}
    else if(v==='zu'){var i=KEY[k];if(i==null)sMissing();else{var hk=r.q.get('hl');sLineage(P[i].root,hk!=null&&KEY[hk]!=null?KEY[hk]:(i!==P[i].root?i:null))}}
    else if(v==='bai')sGuide();
    else if(v==='mp')sMp(+k);
    else if(v==='ying'){if(yOn())sYing();else sMissing()}
    else sBranch(k);
    openSheet();
  }else{closeSheet();renderBase(['story','mai','duo','nian','xun','mp'].indexOf(v)>=0?v:'story',r.q,h)}
}
document.getElementById('back').addEventListener('click',function(){
  if(stack.length>1)history.back();else{stack=[];location.replace(curBaseHash||'#/')}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheet.classList.contains('open'))document.getElementById('back').click()});
window.addEventListener('hashchange',route);
window.addEventListener('resize',function(){document.documentElement.style.setProperty('--toph',(document.getElementById('top').offsetHeight+8)+'px')});
route();
})();
</script>
</body>
</html>
