    <title>小蛮腰·拆AI — 工作坊课程阵地 | 拆的是 AI，拆为己用</title>
    <meta name="description" content="拆AI工作坊课程体系：AI创作、AI建站、AI装备、AI手机、AI编程、AI投资六大模块 21 讲——开通、连接、自动化，3 小时现场做出一件带得走的东西。已上线：公众号流水线（首期）、拆软件 Obsidian、短视频、数字资产安家、活动运营、AI 工作台与手机、高效编程、盯盘/投研/量化。广州越秀小班面授，更多主题开放投票。" />
    <script>
      // 工作坊改版旧路径映射（2026-11 编号→模块化迁移）；本文件经 build 同时产出 index 与 404
      (function () {
        var map = {
          '/workshop/02': '/workshop/m2-1',
          '/workshop/04': '/workshop/m1-4',
          '/workshop/05': '/workshop/m4-5',
          '/workshop/06': '/workshop/classic/06',
          '/workshop/07': '/workshop/classic/07',
          '/workshop/08': '/workshop/m5-1',
          '/workshop/09': '/workshop/m6-2',
          '/workshop/10': '/workshop/m6-1',
          '/workshop/11': '/workshop/m6-3',
          '/workshop/guide.html': '/workshop/classic/first/guide.html',
          '/workshop/dist': '/workshop/classic/first/dist',
          '/workshop/handouts': '/workshop/classic/first/handouts',
          '/workshop/ppt': '/workshop/classic/first/ppt',
          '/workshop/shots': '/workshop/classic/first/shots'
        };
        var p = location.pathname;
        for (var k in map) {
          if (p === k || p.indexOf(k + '/') === 0) {
            location.replace(map[k] + p.slice(k.length) + location.search + location.hash);
            return;
          }
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // SPA redirect for GitHub Pages (handled via 404.html)
      (function() {
        var redirect = sessionStorage.redirect
        delete sessionStorage.redirect
        if (redirect && redirect !== window.location.pathname) {
          history.replaceState(null, null, redirect)
        }
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
