name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for pages artifact visibility
        run: |
          for i in $(seq 1 30); do
            n=$(curl -sf -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              | jq '[.artifacts[]? | select(.name == "github-pages" and .expired == false)] | length')
            echo "attempt $i: github-pages artifacts = $n"
            if [ "${n:-0}" -gt 0 ]; then echo "artifact visible, proceeding"; exit 0; fi
            sleep 10
          done
          echo "::error::github-pages artifact never became visible via API"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
